<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset="UTF-8">
        <title>Lobby</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Irish+Grover&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css"

    </head>
    <body>
        <main class = "container">
            <h2>🌸 your party is ready! 🌸</h2>
            <h3>share this code with your friends!</h3>

            <div class="code_card">
                <span class="code_label">ROOM CODE</span>
                <span class="code">T8ZGCT</span>
            </div>

            <div class="player_count">
                <span id="player_count_text">🐻 1 / 4 players</span>
            </div>

            <div class="avatar_grid" id="avatar_grid">
                <div class="avatar_slot joined">🐻</div>
                <div class="avatar_slot empty">🐰</div>
                <div class="avatar_slot empty">🐱</div>
                <div class="avatar_slot empty">🦊</div>
            </div>

            <div class="lobby_begin">
                <p id="waiting_status" class="waiting_text">waiting for friends... ♡</p>
                <a href="game.html" id="begin_btn" class="button hidden">BEGIN GAME</a>
            </div>
            
            <a href="join.html" class="button secondary_button">back</a>
        </main>
    </body>

</html>
